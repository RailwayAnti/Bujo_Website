<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bujo主题投稿</title>
  <style>
    :root {
      --brand: #4d81bb;
      --brand-dark: #2f5f96;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(0, 0, 0, 0.08);
      --bg: #f5f5f7;
      --card: #ffffff;
      --radius: 8px;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      padding: 0px;
      margin: 0px;
    }

    body {
      margin: 0;
      padding: 0px;
      min-width: 320px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
        "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(255, 255, 255, 0.36);
      background: rgba(251, 251, 253, 0.78);
      backdrop-filter: saturate(180%) blur(18px);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(1180px, calc(100% - 32px));
      height: 48px;
      margin: 0 auto;
      gap: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .brand-mark {
      display: grid;
      width: 24px;
      height: 24px;
      place-items: center;
      border-radius: 7px;
      background: var(--brand);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
    }

    .nav-link {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .hero {
      width: min(1180px, calc(100% - 32px));
      margin: 34px auto 0;
      margin-top: 0px;
      padding: clamp(28px, 5vw, 56px) 0 clamp(18px, 4vw, 42px);
    }

    .hero-kicker {
      margin: 0 0 12px;
      color: var(--brand);
      font-size: 15px;
      font-weight: 700;
    }

    .hero h1 {
      max-width: 860px;
      margin: 0;
      font-size: clamp(36px, 7vw, 78px);
      line-height: 0.96;
      font-weight: 750;
      letter-spacing: 0;
    }

    .hero-copy {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
      gap: 22px;
      align-items: stretch;
      margin-top: clamp(28px, 4vw, 44px);
    }

    .notice {
      display: grid;
      align-content: center;
      min-height: 148px;
      padding: clamp(22px, 4vw, 34px);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background:
        linear-gradient(120deg, rgba(77, 129, 187, 0.14), rgba(255, 255, 255, 0.74)),
        #fff;
      /* box-shadow: var(--shadow); */
    }

    .notice h2 {
      margin: 0 0 10px;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .notice p {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.62;
    }

    .mail-link {
      color: var(--brand-dark);
      font-weight: 700;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .stat {
      display: grid;
      align-content: center;
      min-height: 102px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.72);
    }

    .stat strong {
      display: block;
      color: var(--brand-dark);
      font-size: clamp(25px, 4vw, 38px);
      line-height: 1;
      letter-spacing: 0;
    }

    .stat span {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    main {
      padding-bottom: 68px;
    }

    .authors {
      display: grid;
      gap: clamp(30px, 5vw, 54px);
      margin-top: 10px;
    }

    .author-section {
      width: 100%;
      overflow: hidden;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto 16px;
      gap: 20px;
    }

    .section-title {
      min-width: 0;
    }

    .section-title p {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .section-title h2 {
      margin: 0;
      font-size: clamp(24px, 4vw, 42px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .section-meta {
      color: var(--brand-dark);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .theme-row-wrap {
      position: relative;
    }

    .theme-row {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(260px, 318px);
      gap: 16px;
      overflow-x: auto;
      /* overscroll-behavior-x: contain; */
      /* scroll-snap-type: x proximity; */
      padding: 0 max(16px, calc((100vw - 1180px) / 2)) 14px;
      scrollbar-color: rgba(77, 129, 187, 0.4) transparent;
      scrollbar-width: thin;
    }

    .theme-row::-webkit-scrollbar {
      height: 8px;
    }

    .theme-row::-webkit-scrollbar-thumb {
      border-radius: 99px;
      background: rgba(77, 129, 187, 0.38);
    }

    .theme-card {
      display: grid;
      min-height: 410px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.08);
      scroll-snap-align: start;
    }

    .theme-image {
      position: relative;
      height: 218px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #dce8f4;
    }

    .theme-image img {
      display: block;
      width: auto;
      height: 90%;
      border-radius: 10px;
      object-fit: cover;
      transition: transform 260ms ease;
    }

    .theme-card:hover .theme-image img {
      transform: scale(1.035);
    }

    .tag {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.86);
      color: var(--brand-dark);
      font-size: 12px;
      font-weight: 700;
      backdrop-filter: blur(12px);
    }

    .theme-body {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      padding: 18px;
    }

    .theme-body h3 {
      margin: 0;
      font-size: 21px;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .theme-body p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      min-width: 86px;
      min-height: 38px;
      padding: 9px 16px;
      border: 0;
      border-radius: 999px;
      background: var(--brand);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 180ms ease, transform 180ms ease;
    }

    .download-btn:hover {
      background: var(--brand-dark);
      transform: translateY(-1px);
    }

    .download-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(12px);
    }

    .theme-image img {
      cursor: zoom-in;
    }

    .image-modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(10px);
    }

    .image-modal[hidden] {
      display: none;
    }

    .image-preview {
      max-width: min(92vw, 1100px);
      max-height: 88vh;
      border-radius: var(--radius);
      object-fit: contain;
      background: #fff;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      cursor: zoom-out;
    }

    .image-modal-close {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink);
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
    }


    .download-modal[hidden] {
      display: none;
    }

    .download-dialog {
      position: relative;
      width: min(420px, 100%);
      padding: 28px;
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.22);
    }

    .download-dialog h2 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .modal-theme-name {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: #f2f2f4;
      color: var(--ink);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    .code-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f7f8fa;
    }

    .code-box span {
      color: var(--muted);
      font-size: 14px;
    }

    .code-box strong {
      color: var(--brand-dark);
      font-size: 22px;
      line-height: 1;
      letter-spacing: 2px;
    }

    .copy-download-btn {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 999px;
      background: var(--brand);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 180ms ease, transform 180ms ease;
    }

    .copy-download-btn:hover {
      background: var(--brand-dark);
      transform: translateY(-1px);
    }

    .empty-note {
      width: min(1180px, calc(100% - 32px));
      margin: 20px auto 0;
      margin-left: 0px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
    }

    .footer {
      border-top: 1px solid var(--line);
      background: #fff;
    }

    .footer-inner {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 820px) {
      .topbar-inner {
        width: min(100% - 24px, 1180px);
      }

      .hero {
        width: min(100% - 24px, 1180px);
        margin-top: 10px;
      }

      .hero h1 {
        line-height: 1.02;
      }

      .hero-copy {
        grid-template-columns: 1fr;
      }

      .notice {
        min-height: auto;
      }

      .section-head {
        align-items: start;
        width: min(100% - 24px, 1180px);
      }

      .theme-row {
        grid-auto-columns: minmax(244px, 78vw);
        padding-left: 12px;
        padding-right: 12px;
        scroll-padding-left: 12px;
      }
    }

    @media (max-width: 520px) {
      .nav-link {
        display: none;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .section-head {
        display: grid;
        gap: 8px;
      }

      .section-meta {
        white-space: normal;
      }

      .theme-card {
        min-height: 392px;
      }

      .theme-image {
        height: 198px;
      }
    }
  </style>
</head>
<body>
  <main id="top">
    <section class="hero" aria-labelledby="page-title">
      <p class="hero-kicker">精选主题投稿</p>
      <h1 id="page-title">Bujo主题分享</h1>
      <p class="empty-note">👀 内容较多时可左右滑动查看，点击图片可以查看大图</p>
      <div class="hero-copy">
        <div class="notice">
          <h2>欢迎投稿你的主题文件。</h2>
          <p>
            投稿可以发送主题文件(json)、预览图片、主题名称、主题描述和作者名到
            <a class="mail-link" href="mailto:railwayanti@gmail.com">railwayanti@gmail.com</a>。
            审核整理后会按作者展示在这里。
          </p>
        </div>

        <div class="stats" aria-label="页面统计">
          <div class="stat">
            <strong id="authorCount">0</strong>
            <span>位作者</span>
          </div>
          <div class="stat">
            <strong id="themeCount">0</strong>
            <span>个主题</span>
          </div>
        </div>
      </div>
    </section>

    <div id="authors" class="authors"></div>

  </main>

  <div class="download-modal" id="downloadModal" hidden>
    <div class="download-dialog" role="dialog" aria-modal="true" aria-labelledby="downloadTitle">
      <button class="modal-close" type="button" id="closeDownloadModal" aria-label="关闭">×</button>
      <h2 id="downloadTitle">下载主题</h2>
      <p class="modal-theme-name" id="modalThemeName"></p>

      <div class="code-box">
        <span>提取码</span>
        <strong id="modalCode">----</strong>
      </div>

      <button class="copy-download-btn" type="button" id="copyAndDownload">
        复制提取码并下载
      </button>
    </div>
  </div>

  <div class="image-modal" id="imageModal" hidden>
    <button class="image-modal-close" type="button" id="closeImageModal" aria-label="关闭">×</button>
    <img class="image-preview" id="largePreviewImage" src="" alt="">
  </div>

  <footer class="footer">
    <div class="footer-inner">
      主题版权归原作者所有。下载按钮会跳转到阿里云盘。
    </div>
  </footer>

  <script>

    const authors = [
      {
        name: "辞书旧",
        note: "清爽、轻亮、适合日常使用",
        themes: [
          {
            name: "Kuku",
            description: "橙白色调。",
            image: "imgs/theme/kuku.webp",
            url: "https://www.alipan.com/s/zRxaf45vvED",
            code: "2lb8"
          },
          {
            name: "粉粉糯糯",
            description: "非常具有少女心的一个主题。",
            image: "imgs/theme/粉粉糯糯.webp",
            url: "https://www.alipan.com/s/7MwBGcf5cZq",
            code: "h84j"
          },
          {
            name: "👻喵星",
            description: "🫆",
            image: "imgs/theme/👻喵星.webp",
            url: "https://www.alipan.com/s/nR1fua2oSyK",
            code: "5c8x"
          },
          {
            name: "墨痕册",
            description: "如翻开一本旧日文人的行事册--墨色温润，朱批克制，纸上留的住时间",
            image: "imgs/theme/墨痕册.webp",
            url: "https://www.alipan.com/s/5ffo2aLLLwj",
            code: "00pd"
          },
          {
            name: "恰恰 o",
            description: "整体以低饱和度中性色为主色调，搭配克制的灰冷",
            image: "imgs/theme/恰恰.webp",
            url: "https://www.alipan.com/s/Qm51tS7eZKV",
            code: "8gk4"
          },
          {
            name: "哦喂 o",
            description: "ovo",
            image: "imgs/theme/ovo.webp",
            url: "https://www.alipan.com/s/mYodk8Qtnsx",
            code: "kao0"
          }
        ]
      },
      {
        name: "Rui",
        note: "清爽、轻亮、适合日常使用",
        themes: [
          {
            name: "春樱与夜🌸",
            description: "你也是春天的一部分。",
            image: "imgs/theme/春樱与夜🌸.webp",
            url: "https://www.alipan.com/s/U1LBABDpi22",
            code: "h67q"
          },
          {
            name: "热可可",
            description: "你需要甜品，而我正好有。",
            image: "imgs/theme/热可可.webp",
            url: "https://www.alipan.com/s/djvK4CL5PWT",
            code: "32hz"
          },
          {
            name: "薄雾",
            description: "清晨醒来，太阳就着窗外轻薄的雾色缓缓升起",
            image: "imgs/theme/薄雾.webp",
            url: "https://www.alipan.com/s/VgT2qX1UP74",
            code: "6q9k"
          },
          {
            name: "桃子与桑葚",
            description: "允许自己是颗慢热的果子。",
            image: "imgs/theme/桃子与桑葚.webp",
            url: "https://www.alipan.com/s/aEWDZpBvkRD",
            code: "7p2p"
          }
        ]
      }
    ];

    const authorsRoot = document.querySelector("#authors");
    const totalThemes = authors.reduce((sum, author) => sum + author.themes.length, 0);

    document.querySelector("#authorCount").textContent = authors.length;
    document.querySelector("#themeCount").textContent = totalThemes;

    authorsRoot.innerHTML = authors.map((author) => `
      <section class="author-section" aria-labelledby="author-${author.name}">
        <div class="section-head">
          <div class="section-title">
            <h2 id="author-${author.name}">${author.name} 的投稿</h2>
          </div>
          <div class="section-meta">${author.themes.length} 个主题</div>
        </div>

        <div class="theme-row-wrap">
          <div class="theme-row" aria-label="${author.name} 的全部主题">
            ${author.themes.map((theme) => `
              <article class="theme-card">
                <div class="theme-image">
                  <img src="${theme.image}" alt="${theme.name} 主题预览图" loading="lazy">
                </div>
                <div class="theme-body">
                  <h3>${theme.name}</h3>
                  <p>${theme.description}</p>
                  <button
                    class="download-btn"
                    type="button"
                    data-name="${theme.name}"
                    data-url="${theme.url}"
                    data-code="${theme.code}"
                  >
                    下载
                  </button>
                </div>
              </article>
            `).join("")}
          </div>
        </div>
      </section>
    `).join("");

    const downloadModal = document.querySelector("#downloadModal");
    const closeDownloadModal = document.querySelector("#closeDownloadModal");
    const modalThemeName = document.querySelector("#modalThemeName");
    const modalCode = document.querySelector("#modalCode");
    const copyAndDownload = document.querySelector("#copyAndDownload");
    const imageModal = document.querySelector("#imageModal");
    const closeImageModal = document.querySelector("#closeImageModal");
    const largePreviewImage = document.querySelector("#largePreviewImage");


    let currentDownload = null;

    authorsRoot.addEventListener("click", (event) => {
      const image = event.target.closest(".theme-image img");

      if (image) {
        largePreviewImage.src = image.src;
        largePreviewImage.alt = image.alt;
        imageModal.hidden = false;
        return;
      }

      const button = event.target.closest(".download-btn");
      if (!button) return;

      currentDownload = {
        name: button.dataset.name,
        url: button.dataset.url,
        code: button.dataset.code
      };

      modalThemeName.textContent = currentDownload.name;
      modalCode.textContent = currentDownload.code;
      downloadModal.hidden = false;
    });

    const closeLargeImage = () => {
      imageModal.hidden = true;
      largePreviewImage.src = "";
      largePreviewImage.alt = "";
    };

    closeImageModal.addEventListener("click", closeLargeImage);

    imageModal.addEventListener("click", (event) => {
      if (event.target === imageModal || event.target === largePreviewImage) {
        closeLargeImage();
      }
    });

    const closeModal = () => {
      downloadModal.hidden = true;
      currentDownload = null;
    };

    closeDownloadModal.addEventListener("click", closeModal);

    downloadModal.addEventListener("click", (event) => {
      if (event.target === downloadModal) {
        closeModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;

      if (!imageModal.hidden) {
        closeLargeImage();
        return;
      }

      if (!downloadModal.hidden) {
        closeModal();
      }
    });


    copyAndDownload.addEventListener("click", async () => {
      if (!currentDownload) return;

      try {
        await navigator.clipboard.writeText(currentDownload.code);
      } catch (error) {
        const input = document.createElement("input");
        input.value = currentDownload.code;
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();
      }

      window.open(currentDownload.url, "_blank", "noopener");
      closeModal();
    });
  </script>
</body>
</html>
